<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   
         <h1>Student Registration Form </h1>

    <form action="">

        <fieldset>

            <legend>
                <h2>Personal information</h2>
            </legend>

            <table>

            <tr>
                <td><label for="firstname">First Name</label></td>
                <td><input type="text" name="" id="firstname"></td>
            </tr>

            <tr>
                <td><label for="secondname">Second Name</label></td>
                <td><input type="text" name="" id="secondname"></td>
            </tr>
            
            <tr>
                <td><label for="">Email</label></td>
                <td><input type="email" name="" id=""></td>
            </tr>
           
            <tr>
                <td><label for="">Phone Number</label></td>
                <td><input type="tel" name="" id=""></td>
            </tr>
            
            <tr>
                <td><label for="">DOB</label></td>
                <td><input type="date" name="" id=""></td>
            </tr>
            
            <tr>
                <td><label for="">Gender</label></td>
                <td>
                    <input type="radio" name="Gender" id="">Male
                    <input type="radio" name="Gender" id="">Female
                    <input type="radio" name="Gender" id="">others
                </td>
            </tr>
            </table>
        </fieldset>

        <fieldset>

            <legend>
                <h2>Acadamic Information</h2>
            </legend>

            <table>

            <tr>
                <td><label for="">Select course</label></td>
                <td>
                    <select name="" id="">
                        <option value=""disabled selected>select your course</option>
                        <option value="">Computer application</option>
                        <option value="">B.Tech</option>
                        <option value="">BE</option>
                        <option value="">BSC</option>
                        <option value="">BCA</option>
                    </select>
                </td>
            </tr>
           
            <tr>
                <td><label for="">Skill</label></td>
                <td><input type="text" name="" placeholder="Select your skill" id=""list=skills></td>
                <td>
                        <datalist id="skills">
                            <option value="HTML">HTML</option>
                            <option value="CSS">CSS</option>
                            <option value="JS">JS</option>
                            <option value="JAVA">JAVA</option>
                            <option value="PYTHON">PYTHON</option>
                        </datalist>
                    </select>
                </td>
            </tr>
           
            <tr>
                <td><label for="">Address</label></td>
                <td><textarea name="" id=""placeholder="Type your address"></textarea></td>
            </tr>

            </table>
        </fieldset>

        <fieldset>

            <legend>
                <h2>Login Credentials</h2>
            </legend>

            <table>
            <tr>
                    <td><label for="">Username</label></td>
                    <td><input type="text" name="" id=""></td>
            </tr>
            <tr>
                    <td><label for="">Password</label></td>
                    <td><input type="password" name="" id=""></td>
            </tr>
            <tr>
                    <td><label for="">Confirm password</label></td>
                    <td><input type="password" name="" id=""></td>
            </tr>

            </table>
        </fieldset>

        <fieldset>

            <legend>
                <h2>Declaration</h2>
            </legend>

            <table>

                <tr>
                    <td><input type="checkbox" name="" id=""></td>
                    <td><label for="">Trems and Conditions</label></td>
                </tr>
                  
            </table>

            <button>Regiter</button>
            <button>Reset</button>
            
        </fieldset>
    </form>
</body>
</html>
