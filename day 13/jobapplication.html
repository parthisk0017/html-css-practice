<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>
                <h2>Job Application</h2>
            </legend>
            <table>
                <tr>
                    <td><label for="">First Name</label></td>
                    <td> <input type="text" name="" id=""></td>
                </tr>
                <tr>
                    <td><label for="">Last Name</label></td>
                    <td><input type="text" name="" id=""></td>
                </tr>
                <tr>
                    <td><label for="">Email</label></td>
                    <td><input type="email" name="" id=""></td>
                </tr>
                <tr>
                    <td><label for="">Phone</label></td>
                    <td><input type="tel" name="" id=""></td>
                </tr>
                <tr>
                    <td><label for="">DOB</label></td>
                    <td><input type="date" name="" id=""></td>
                </tr>
                <tr>
                    <td><label for="">Gender:</label></td>
                    <td><input type="radio" name="Gender" id="">male
                        <input type="radio" name="Gender" id="">Female
                        <input type="radio" name="Gender" id="">Others
                    </td>
                </tr>
                <tr>
                    <td><label for="">Address</label></td>
                    <td><textarea name="" id=""></textarea></td>
                </tr>
                <tr>
                    <td><label for="">City</label></td>
                    <td><input type="text"placeholder="type or search your city"size="25" name="" id=""list="cities"></td>
                   
                    <datalist id="cities">

                        <option value="chennai">chennai</option>
                        <option value="tricy">tricy</option>
                        <option value="selam">selam</option>
                        <option value="madurai">madurai</option>

                    </datalist>

                </tr>
                <tr>
                    <td><label for="">Choose Resume:</label></td>
                    <td><input type="file" name="" id=""></td>
                </tr>
                <tr>
                    <td><label for="">Select Skill:</label></td>
                    <td> 
                        <input type="checkbox" name="" id="">HTML
                        <input type="checkbox" name="" id="">SQL
                        <input type="checkbox" name="" id="">JS
                        <input type="checkbox" name="" id="">Java
                        <input type="checkbox" name="" id="">Python
                    </td>
                </tr>
                <tr>
                    <td><label for="">Select role</label></td>
                    <td>
                    <select name="" id="">
                        <option value=""disabled selected>select your role</option>
                        <option value="frontend developer">frontendDeveloper</option>
                        <option value="backend developer">backendDeveloper</option>
                        <option value="fullstackk developer">fullstackDeveloper</option>
                    </select> </td>
                </tr>
                <tr>
                    <td><label for="">Experience:</label></td>
                    <td>
                        <select name="" id="">
                            <option value=""disabled selected>Select your Experience</option>
                            <option value="Fresher">Fresher</option>
                            <option value="1year">1year</option>
                            <option value="2year">2years</option>
                            <option value="3year">3years</option>
                            <option value="4year">4years</option>
                            <option value="more than 5">more than 5</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="">Languages known:</label></td>
                    <td><input type="number" name="" id=""></td>
                </tr>
                <tr>
                    <td><label for="">Willing to Relocate</label></td>
                    <td>
                        <input type="radio" name="" id="">Yes
                        <input type="radio" name="" id="">No
                    </td>
                </tr>
                
            </table>
        </fieldset>
        <button>Submit</button>
        <button>Reset</button>
    </form>
</body>
</html>
