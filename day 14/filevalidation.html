<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>File Validation in HTML</h1>
    <form action="">
        <div>
            <label for="">Upload resume</label>
            <input type="file" accept=".pdf" name="" id="" multiple name="">
        </div>
<br>
        <div>
            <label for="">Upload video</label>
            <input type="file" accept="video/*" name="" id="">
        </div>
<br>
        <div>
            <label for="">Upload photo</label>
            <input type="file" accept=".png" name="" id="">
        </div>
<br>
        <div>
            <label for="">Upload song</label>
            <input type="file" accept=".mp3" name="" id="">
        </div>
    </form>
</body>
</html>
