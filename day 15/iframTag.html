<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Iframe Tag</h1>
    <h2>Embedding External webpage by using Iframe Tag</h2>
    <iframe src="https://www.ndtv.com/" 
    frameborder="1"
    width="800"
    height="500"
    ></iframe>

    <h2>Embedding our own webpage by using iframe tag</h2>
    <iframe src="./video/WhatsApp Video 2026-05-02 at 10.41.31 AM.mp4" frameborder="1" width="800"height="500" ></iframe>

    <h2>Embedding youtube video by using iframe tag</h2>
    <iframe width="800" height="500" src="https://www.youtube.com/embed/yKizwXo57UQ?si=H4N67LvcGVw5q6TL" 
    title="YouTube video player"
     frameborder="1" 
     allow="accelerometer;
    \ autoplay; clipboard-write; encrypted-media;
     gyroscope; picture-in-picture; web-share" 
     referrerpolicy="strict-origin-when-cross-origin" allowfullscreen >
    </iframe>

    <h2>Embedding google maps by using iframe tag</h2>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14376.485089453896!2d80.18207074245717!3d13.334247071596177!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a5278b41bef343b%3A0x4a9ea1928f03b9a!2sPonneri%2C%20Tamil%20Nadu%20601204!5e1!3m2!1sen!2sin!4v1777623413602!5m2!1sen!2sin"
     width="800" height="500" style="border:1;" allowfullscreen="" 
    loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

    <h2>Embedding QR code by using iframe Tag</h2>
    <iframe src="https://api.qrserver.com/v1/create-qr-code/?size=350x250&data=https://youtu.be/oLmUrFeYMCg?si=UCVoeLhGTRb96Nt9" frameborder="1" width="600"height="300"></iframe>

</body>
</html>
