<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Audio tag in HTMl</h1>
    <audio src="http://webaudioapi.com/samples/audio-tag/chrono.mp3"
     controls
     autoplay
     muted
    ></audio>
    <h2>Audio Tag by using siurce Tag</h2>
    <audio controls>
        <source src="http://webaudioapi.com/samples/audio-tag/chrono.mp3"
        type="audio/mp3">
    </audio>
</body>
